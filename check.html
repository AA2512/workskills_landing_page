<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            max-height: 700px;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .hero img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            padding: 0 20px 60px 20px;
            max-width: 350px;
            z-index: 2;
        }

        .hero-content h1 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .hero-content p {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
            border: none;
        }

        .btn-register {
            background: #22c55e;
            color: white;
        }

        .btn-explore {
            background: white;
            color: #111;
        }

        .dots {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
        }

        .dot.active {
            width: 10px;
            height: 10px;
            background: #22c55e;
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="hero">
        <img src="images/home/heroImage01-min.png" alt="Hero Image">
        <div class="overlay"></div>

        <div class="hero-content">
            <h1>Learn • Intern • Get a Job</h1>
            <p>
                Learn offline, build portfolio projects, and move into interviews with help at every step.
            </p>

            <button class="btn btn-register">Register Now</button>
            <button class="btn btn-explore">Explore Tracks</button>

            <div class="dots">
                <div class="dot"></div>
                <div class="dot active"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

</body>

</html>
