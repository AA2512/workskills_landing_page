<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkSkills Career Action Plan Quiz</title>
    <link rel="shortcut icon" href="images/common/favicon.svg" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --brand-primary: #48bf84;
            --brand-black: #1A1A1A;
            --brand-primary-light: #eaf8f1;
        }

        html,
        body {
            height: 100%;
            /* Allow vertical scrolling for overflow content on all screens */
            overflow-y: auto;
            /* Enable smooth scrolling when navigating overflow content */
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .quiz-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex-grow: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #screens {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding-bottom: 1rem;
        }

        .progress-bar-fill {
            transition: width 0.5s ease-in-out;
            background: linear-gradient(90deg, var(--brand-primary), #3db878);
        }

        .option-card {
            /* Snappy interaction: reduce transition duration for a more instant feel */
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-width: 2px;
            border-color: #F3F4F6;
        }

        .option-card:hover {
            border-color: var(--brand-primary-light);
            transform: translateY(-2px);
        }

        .option-card.selected,
        .option-card.multi-selected {
            border-color: var(--brand-primary);
            background-color: var(--brand-primary-light);
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 12px 28px rgba(72, 191, 132, 0.3);
        }

        /* Back button styling: sits in the header. Hidden on first screen, shown on subsequent steps. */
        #backBtn {
            width: 2.5rem;
            height: 2.5rem;
            background-color: transparent;
            border: 2px solid #E5E7EB;
            border-radius: 0.75rem;
            color: var(--brand-black);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease;
            box-shadow: none;
            /* Position the back button at the top of the header so it sits above the progress bar */
            top: 0;
            transform: translateY(0);
        }

        #backBtn:hover {
            background-color: var(--brand-primary-light);
        }

        #backBtn svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* Utility class for vertically stacked option cards. Ensures the card uses a horizontal layout with bigger icon and text. */
        .option-card.vertical {
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
        }

        .option-card.vertical .icon {
            margin-right: 1rem;
            font-size: 2rem;
        }

        .option-card.vertical span {
            font-weight: normal;
            font-size: 1.125rem;
        }

        /* Hide the small phase heading (e.g., "Phase 1: Profiling You") on all screens */
        #progressText {
            display: none;
        }

        .ws-input,
        .ws-select {
            border: 2px solid #E0E0E0;
            transition: all 0.2s ease-in-out;
        }

        .ws-input:focus,
        .ws-select:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px var(--brand-primary-light);
            outline: none;
        }

        .screen-content {
            /* Use a smooth slide-and-fade animation for each screen, giving a more polished transition */
            animation: slideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }

        /* Fade-in keyframe retained for backwards compatibility if needed */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Slide-in animation with a slight upward movement and fade */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stagger-item {
            opacity: 0;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .stagger-1 {
            animation-delay: 0.1s;
        }

        .stagger-2 {
            animation-delay: 0.2s;
        }

        .stagger-3 {
            animation-delay: 0.3s;
        }

        .stagger-item-1 {
            animation-delay: 0.3s;
        }

        .stagger-item-2 {
            animation-delay: 0.4s;
        }

        .stagger-item-3 {
            animation-delay: 0.5s;
        }

        .stagger-item-4 {
            animation-delay: 0.6s;
        }

        .stagger-item-5 {
            animation-delay: 0.7s;
        }

        .stagger-item-6 {
            animation-delay: 0.8s;
        }

        /* Carousel animation used on the Student Placements Showcase screen.
           Slides the inner flex container horizontally to create an auto-scrolling effect. */
        @keyframes scrollCarousel {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-carousel {
            /* Increase the carousel speed: shorter duration means faster movement */
            animation: scrollCarousel 20s linear infinite;
        }


        /* Slider Styles */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 8px;
            background: #e5e7eb;
            border-radius: 5px;
        }

        input[type=range]::-moz-range-track {
            height: 8px;
            background: #e5e7eb;
            border-radius: 5px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            margin-top: -8px;
            background-color: var(--brand-primary);
            height: 24px;
            width: 24px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 2px #ccc;
        }

        input[type=range]::-moz-range-thumb {
            background-color: var(--brand-primary);
            height: 24px;
            width: 24px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 0 0 2px #ccc;
        }

        /*
         * Responsive tweaks for mobile devices
         *
         * The quiz was originally designed for desktop viewports which meant some screens
         * could require scrolling on small devices. To deliver a more polished user
         * experience, we scale down typography, compact card sizes and adjust grid
         * layouts so each step fits fully within a typical mobile viewport without
         * introducing vertical scroll bars. We also remove the default center alignment
         * on the screen container for mobile so content starts from the top.
         */
        @media (max-width: 640px) {

            /* Start content at the top rather than vertically centering it on mobile */
            #screens {
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {

            /* Shrink the base font size to scale down all rem-based typography */
            html {
                font-size: 14px;
            }

            /* Remove overflow restrictions on mobile to allow smooth scrolling */
            body,
            html {
                overflow-y: auto;
            }

            main {
                overflow-y: auto;
            }

            #screens {
                overflow-y: auto;
            }

            /* Use three columns instead of two for option grids to reduce the number of rows */
            .grid.grid-cols-2 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            /* Compact option cards: reduce padding */
            #screens .option-card {
                padding-top: 0.75rem;
                padding-bottom: 0.75rem;
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }

            /* Shrink icons inside option cards */
            #screens .option-card .text-3xl {
                font-size: 1.75rem;
                line-height: 1.2;
            }

            /* Shrink labels inside option cards */
            #screens .option-card span {
                font-size: 0.875rem;
                line-height: 1.2;
            }

            /* Reduce heading sizes on quiz screens */
            #screens h2 {
                font-size: 1.75rem;
                line-height: 1.3;
            }

            /* Decrease the top/bottom margin for the visual section in the hook screen */
            .my-6 {
                margin-top: 1rem;
                margin-bottom: 1rem;
            }

            /* Reduce padding on inputs and selects */
            .ws-input,
            .ws-select {
                padding: 0.75rem;
                font-size: 0.875rem;
            }

            /* Reduce padding and font size on CTA buttons */
            .form-submit-btn {
                padding-top: 0.75rem;
                padding-bottom: 0.75rem;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>

                            if (isAgeScreen) {
                                // For age selection, render compact centred cards without animations
                                return `<div class="option-card bg-white rounded-xl p-4 flex items-center justify-center shadow-md border-2 border-gray-100" data-value="${opt.value}"><span class="text-lg font-semibold">${opt.text}</span></div>`;
                            } else {
                                // Standard vertically stacked card with icon and label, including stagger animations
                                return `<div class="option-card vertical bg-white rounded-2xl py-6 px-5 flex items-center w-full shadow-md border-2 border-gray-100 stagger-item stagger-item-${index + 1}" data-value="${opt.value}"><div class="text-5xl mr-5">${opt.icon || ''}</div><span class="text-gray-800 text-xl">${opt.text}</span></div>`;
                            }
                        }).join('');
                        // Use a grid layout for the age screen; otherwise stack vertically
                        const containerClass = isAgeScreen ? 'grid grid-cols-4 sm:grid-cols-6 gap-3' : 'flex flex-col space-y-5';
                        let nextSection = '';
                        if (screenData.type === 'visual-mcq-multi') {
                            // Multi-select screens include a Next button that is disabled until at least one option is selected
                            nextSection = `<div class="mt-6 text-center stagger-3"><button class="multi-next-btn bg-[var(--brand-primary)] text-white font-bold py-4 px-10 rounded-xl shadow-md transition-all hover:bg-green-700 disabled:opacity-50" disabled>Next</button></div>`;
                        }
                        content = `<div class="text-center mb-4 stagger-1"><h2 class="text-3xl font-extrabold text-black">${title}</h2>${instruction}</div><div class="${containerClass}">${optionsHtml}</div>${nextSection}`;
                        break;
                    }
                    case 'hook':
                        content = `<div class="text-center p-2 flex flex-col items-center justify-center stagger-1"><h2 class="text-3xl sm:text-4xl font-extrabold leading-tight">${title}</h2><p class="text-gray-600 mt-2 text-base md:text-lg stagger-2">${screenData.text || ''}</p><div class="my-6 max-w-sm w-full stagger-2">${screenData.visual}</div><button class="form-submit-btn bg-[var(--brand-primary)] text-white font-bold py-4 px-12 rounded-xl shadow-lg shadow-green-500/30 hover:bg-green-700 transition-all transform hover:scale-105 stagger-3">${screenData.cta}</button></div>`;
                        break;
                    case 'text-input': {
                        // For plain text-input screens (name, phone, etc.), honour any provided fields array.
                        const fields = screenData.fields || [{
                            id: screenData.id,
                            placeholder: screenData.placeholder,
                            // Use appropriate input types based on the field id
                            type: (screenData.id === 'phone') ? 'tel' : (screenData.id === 'email') ? 'email' : 'text',
                            validation: screenData.validation
                        }];
                        content = `<div class="text-center p-2 flex flex-col items-center justify-center stagger-1">
    <h2 class="text-3xl font-extrabold leading-tight">${title}</h2>
    <p class="text-gray-600 mt-2 text-base md:text-lg stagger-2">${screenData.subtext || ''}</p>
    <div class="mt-8 space-y-2 w-full max-w-sm mx-auto stagger-3">
        ${fields.map(field => `
        <div>
            <input type="${field.type}" id="${field.id}"
                autocomplete="${field.id === 'name' ? 'name' : field.id === 'phone' ? 'tel' : field.id === 'email' ? 'email' : ''}"
                class="w-full p-4 border-2 rounded-lg text-lg ws-input"
                placeholder="${field.placeholder}"
                value="${formData[field.id] || localStorage.getItem(field.id) || ''}">
            <p id="${field.id}-error" class="text-red-500 text-sm text-left h-4"></p>
        </div>
        `).join('')}
    </div>
    <button class="form-submit-btn mt-6 bg-[var(--brand-primary)] text-white font-bold py-4 px-12 rounded-xl shadow-lg shadow-green-500/30 hover:bg-green-700 transition-all transform hover:scale-105 disabled:opacity-50 stagger-3">${screenData.cta}</button>
</div>`;
                        break;
                    }
                    case 'final': {
                        // Final screen: collect email with an enhanced card UI.  Always respect the fields array if provided.
                        const fields = screenData.fields || [{
                            id: 'email',
                            placeholder: 'Enter your email',
                            type: 'email',
                            validation: screenData.validation
                        }];
                        content = `<div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 max-w-md w-full mx-auto flex flex-col items-center text-center space-y-4 stagger-1">
    <div class="text-green-500 stagger-1">
        <!-- Envelope icon to symbolise email capture -->
        <svg class="w-14 h-14 mx-auto" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.25 4.5A2.25 2.25 0 014.5 2.25h15a2.25 2.25 0 012.25 2.25v15a2.25 2.25 0 01-2.25 2.25h-15A2.25 2.25 0 012.25 19.5V4.5zM3 5.621V19.5a.75.75 0 00.75.75h15a.75.75 0 00.75-.75V5.62L12 12 3 5.621zM4.383 4.5L12 9.879l7.617-5.379H4.383z"></path>
        </svg>
    </div>
    <h2 class="text-3xl font-extrabold">${title}</h2>
    <p class="text-gray-600 text-base md:text-lg">${screenData.subtext || ''}</p>
    <div class="w-full mt-4 space-y-2">
        ${fields.map(field => `
        <div>
            <input type="${field.type}" id="${field.id}"
                autocomplete="${field.id === 'email' ? 'email' : ''}"
                class="w-full p-4 border-2 rounded-lg text-lg ws-input"
                placeholder="${field.placeholder}"
                value="${formData[field.id] || localStorage.getItem(field.id) || ''}">
            <p id="${field.id}-error" class="text-red-500 text-sm text-left h-4"></p>
        </div>
        `).join('')}
    </div>
    <button class="form-submit-btn mt-4 bg-[var(--brand-primary)] text-white font-bold py-4 px-10 rounded-xl shadow-lg shadow-green-500/30 hover:bg-green-700 transition-all transform hover:scale-105 disabled:opacity-50">${screenData.cta}</button>
</div>`;
                        break;
                    }
                    case 'dropdown':
                        // Render a dropdown with a Next button. Users must explicitly click Next to proceed.
                        content = `<div class="text-center p-6 sm:p-8 flex flex-col justify-center w-full max-w-md mx-auto stagger-1">
    <h2 class="text-3xl font-extrabold">${title}</h2>
    <div class="mt-8 stagger-2">
        <select id="${screenData.id}" class="w-full p-4 border-2 rounded-lg text-lg ws-select">
            <option value="" disabled selected>Select your city</option>
            ${screenData.options.map(o => `<option value="${o}">${o}</option>`).join('')}
        </select>
    </div>
    <div class="mt-6 stagger-3">
        <button class="dropdown-next-btn bg-[var(--brand-primary)] text-white font-bold py-4 px-10 rounded-xl shadow-md transition-all hover:bg-green-700 disabled:opacity-50" disabled>Next</button>
    </div>
</div>`;
                        break;
                    case 'tabs':
                        content = `<div class="text-center p-2 md:p-6 flex flex-col items-center justify-center w-full max-w-md mx-auto stagger-1"><h2 class="text-3xl font-extrabold leading-tight">${title}</h2><div class="mt-8 grid grid-cols-2 gap-3 w-full stagger-2">${screenData.options.map((opt, index) => `<button class="option-tab bg-white p-4 rounded-lg border-2 stagger-item stagger-item-${index + 1}" data-value="${opt}">${opt}</button>`).join('')}</div></div>`
                        break;
                    case 'dual-slider':
                        content = `<div class="text-center p-2 md:p-6 flex flex-col items-center justify-center w-full max-w-md mx-auto stagger-1"><h2 class="text-3xl font-extrabold leading-tight">${title}</h2><div class="w-full mt-8 space-y-8 stagger-2"><div><label class="font-semibold">${screenData.currentLabel}</label><div class="flex items-center space-x-4"><input type="range" id="currentSalary" class="w-full" min="0" max="50" value="0"><p id="current-value" class="text-lg font-bold text-gray-800 w-24 text-right"></p></div><div class="mt-2 text-left"><label class="text-sm"><input type="checkbox" id="fresher-checkbox"> I'm a Fresher</label></div></div><div><label class="font-semibold">${screenData.targetLabel}</label><div class="flex items-center space-x-4"><input type="range" id="targetSalary" class="w-full" min="0" max="50" value="5"><p id="target-value" class="text-lg font-bold text-[var(--brand-primary)] w-24 text-right"></p></div></div></div><button class="form-submit-btn mt-8 bg-[var(--brand-black)] text-white font-bold py-4 px-12 rounded-xl shadow-lg transition-all stagger-3">Next</button></div>`;
                        break;
                    case 'nurture':
                        // Nurture screens: present informational content in a polished card with a timed Next button.
                        // Increase padding and spacing on nurture screens for a more breathable layout
                        content = `<div class="bg-white rounded-2xl shadow-lg p-8 sm:p-10 max-w-lg w-full mx-auto flex flex-col items-center justify-center text-center space-y-6 stagger-1">
    <h2 class="text-3xl font-extrabold">${screenData.title}</h2>
    <p class="text-gray-600 text-base">${screenData.text}</p>
    <div class="w-full">${screenData.visual}</div>
    <button id="nurture-next-btn" class="mt-4 bg-[var(--brand-primary)] text-white font-bold py-3 px-8 rounded-xl shadow-md transition-all disabled:opacity-50" disabled>Next</button>
</div>`;
                        break;
                }
                screenWrapper.innerHTML = content;
                screensContainer.appendChild(screenWrapper);
                addEventListeners();
            };

            const addEventListeners = () => {
                const screenData = quizFlow[currentScreenIndex];
                if (screenData.type === 'visual-mcq') {
                    // Single-choice questions: highlight the selected card and delay navigation
                    document.querySelectorAll('.option-card').forEach(card => {
                        card.addEventListener('click', () => {
                            formData[screenData.id] = card.dataset.value;
                            // Remove any previous selections on the same screen
                            document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
                            // Apply the selected state to the clicked card
                            card.classList.add('selected');
                            // Wait briefly so the user can see the selection change before moving on
                            setTimeout(() => navigate(1), 300);
                        });
                    });
                } else if (screenData.type === 'visual-mcq-multi') {
                    // Multi-select interactions: allow multiple selections (up to the defined limit) without auto-advancing.
                    formData[screenData.id] = formData[screenData.id] || [];
                    const nextBtn = document.querySelector('.multi-next-btn');
                    if (nextBtn) {
                        // Disable the Next button initially when there are no selections
                        nextBtn.disabled = !formData[screenData.id] || formData[screenData.id].length === 0;
                        nextBtn.classList.toggle('opacity-50', nextBtn.disabled);
                    }
                    document.querySelectorAll('.option-card').forEach(card => {
                        // Restore previously selected options on back navigation
                        if (formData[screenData.id].includes(card.dataset.value)) {
                            card.classList.add('multi-selected');
                        }
                        card.addEventListener('click', () => {
                            const value = card.dataset.value;
                            const selected = formData[screenData.id];
                            if (selected.includes(value)) {
                                // Deselect the value
                                formData[screenData.id] = selected.filter(v => v !== value);
                                card.classList.remove('multi-selected');
                            } else if (selected.length < screenData.limit) {
                                // Select the value
                                formData[screenData.id].push(value);
                                card.classList.add('multi-selected');
                            }
                            // Update Next button state based on whether at least one option is selected
                            if (nextBtn) {
                                const hasSelection = formData[screenData.id] && formData[screenData.id].length > 0;
                                nextBtn.disabled = !hasSelection;
                                nextBtn.classList.toggle('opacity-50', nextBtn.disabled);
                            }
                        });
                    });
                    // Bind the Next button to navigate when clicked and a selection has been made
                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => {
                            if (formData[screenData.id] && formData[screenData.id].length > 0) {
                                navigate(1);
                            }
                        });
                    }
                } else if (screenData.type === 'hook') {
                    document.querySelector('.form-submit-btn').addEventListener('click', () => navigate(1));
                } else if (screenData.type === 'text-input' || screenData.type === 'final') {
                    const button = document.querySelector('.form-submit-btn');
                    // For final screens we always rely on the provided fields array (e.g., the email field).  Using
                    // screenData.id ("final") as a field id would not correspond to any actual input element,
                    // resulting in missing listeners and broken validation.  For text-input screens, if a fields
                    // array isn't supplied we fall back to a single field based on the screen id.
                    let fields;
                    if (screenData.type === 'final') {
                        fields = screenData.fields || [{ id: 'email', placeholder: 'Enter your email', type: 'email', validation: screenData.validation }];
                    } else if (screenData.id) {
                        fields = [{ id: screenData.id, validation: screenData.validation }];
                    } else {
                        fields = screenData.fields || [{ id: 'email', placeholder: 'Enter your email', type: 'email', validation: screenData.validation }];
                    }
                    const inputs = fields.map(f => document.getElementById(f.id));

                    const validateField = (input, validation) => {
                        const errorEl = document.getElementById(`${input.id}-error`);
                        if (!validation || !errorEl) return true;
                        if (!validation.regex.test(input.value)) {
                            errorEl.textContent = validation.error;
                            return false;
                        }
                        errorEl.textContent = '';
                        return true;
                    };

                    const validateAll = () => {
                        let allValid = true;
                        inputs.forEach((input, i) => {
                            if (!validateField(input, fields[i].validation)) allValid = false;
                            if (!input.value.trim()) allValid = false;
                        });
                        button.disabled = !allValid;
                    };

                    inputs.forEach((input, i) => {
                        input.addEventListener('input', () => {
                            formData[input.id] = input.value;
                            // Persist this field to localStorage for auto-prefill on subsequent visits
                            try {
                                localStorage.setItem(input.id, input.value);
                            } catch (e) {
                                console.warn('Unable to store field value', e);
                            }
                            validateField(input, fields[i].validation);
                            validateAll();
                        });
                    });
                    // For standard text-input screens, clicking the CTA should advance normally.  For the
                    // final email capture screen, persist the captured field and then trigger the
                    // built‑in thank‑you routine so that the data is submitted and the user is redirected.
                    button.addEventListener('click', () => {
                        // Persist the entered values
                        inputs.forEach((input, i) => {
                            formData[input.id] = input.value;
                            try {
                                localStorage.setItem(input.id, input.value);
                            } catch (e) {
                                console.warn('Unable to store field value', e);
                            }
                        });
                        if (screenData.type === 'final') {
                            // Copy the entered email into the legacy 'final' field to maintain backward
                            // compatibility with existing data schemas.  This ensures that downstream
                            // integrations expecting a value in the 'final' column still receive the email.
                            if (formData.email) {
                                formData.final = formData.email;
                            }
                            // Show the full thank‑you screen, which also submits the data and redirects
                            renderThankYou();
                        } else {
                            navigate(1);
                        }
                    });
                    validateAll();
                } else if (screenData.type === 'dual-slider') {
                    document.querySelector('.form-submit-btn').addEventListener('click', () => navigate(1));
                    setupSlider('currentSalary', 'current-value', (v) => `${v}L`);
                    setupSlider('targetSalary', 'target-value', (v) => `${v}L`);
                    const fresherCheckbox = document.getElementById('fresher-checkbox');
                    const currentSalarySlider = document.getElementById('currentSalary');
                    const currentValueEl = document.getElementById('current-value');
                    fresherCheckbox.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            currentSalarySlider.value = 0;
                            currentSalarySlider.disabled = true;
                            currentValueEl.textContent = 'Fresher';
                            formData.currentSalary = 'Fresher';
                        } else {
                            currentSalarySlider.disabled = false;
                            setupSlider('currentSalary', 'current-value', (v) => `${v}L`);
                        }
                    });
                } else if (screenData.type === 'tabs') {
                    document.querySelectorAll('.option-tab').forEach(tab => {
                        tab.addEventListener('click', () => {
                            formData[screenData.id] = tab.dataset.value;
                            document.querySelectorAll('.option-tab').forEach(t => t.classList.remove('selected', 'bg-green-100', 'border-green-500'));
                            tab.classList.add('selected', 'bg-green-100', 'border-green-500');
                            // Shorter delay for tab selection
                            setTimeout(() => navigate(1), 100);
                        })
                    })
                } else if (screenData.type === 'dropdown') {
                    const select = screensContainer.querySelector('select');
                    const nextBtn = screensContainer.querySelector('.dropdown-next-btn');
                    if (select) {
                        // When the user selects a city, enable the Next button
                        select.addEventListener('change', () => {
                            formData[screenData.id] = select.value;
                            if (select.value) {
                                if (nextBtn) {
                                    nextBtn.disabled = false;
                                    nextBtn.classList.remove('opacity-50');
                                }
                            } else {
                                if (nextBtn) {
                                    nextBtn.disabled = true;
                                    nextBtn.classList.add('opacity-50');
                                }
                            }
                        });
                    }
                    // On clicking Next, proceed to the next screen if a selection is made
                    if (nextBtn) {
                        nextBtn.addEventListener('click', () => {
                            if (!nextBtn.disabled) {
                                navigate(1);
                            }
                        });
                    }
                } else if (screenData.type === 'nurture') {
                    // For nurture screens, show a Next button that remains disabled briefly before enabling navigation
                    const nextBtn = document.getElementById('nurture-next-btn');
                    if (nextBtn) {
                        // Enable after 2.5 seconds
                        setTimeout(() => {
                            nextBtn.disabled = false;
                        }, 2500);
                        nextBtn.addEventListener('click', () => {
                            if (!nextBtn.disabled) {
                                navigate(1);
                            }
                        });
                    }
                }
            };

            function setupSlider(id, valueId, formatFn) {
                const slider = document.getElementById(id);
                const valueEl = document.getElementById(valueId);
                const salaryValues = Array.from({ length: 51 }, (_, i) => i);
                function update() {
                    const value = salaryValues[slider.value];
                    valueEl.textContent = formatFn(value);
                    formData[id] = formatFn(value);
                }
                slider.addEventListener('input', update);
                update();
            }

            const updateProgress = () => {
                const stepCounterEl = document.getElementById('step-counter');
                if (currentScreenIndex === 0) {
                    // On the first screen, clear the step counter and return early.
                    if (stepCounterEl) stepCounterEl.textContent = '';
                    return;
                }
                const progress = ((currentScreenIndex - 1) / (quizFlow.length - 2)) * 100;
                document.getElementById('progressBar').style.width = `${progress}%`;
                document.getElementById('progress-per').innerText = `${Math.round(progress)}%`;
                // Update the header step counter (e.g., 7/21)
                if (stepCounterEl) {
                    const totalSteps = quizFlow.length;
                    stepCounterEl.textContent = `${currentScreenIndex}/${totalSteps}`;
                }
                // Remove phase messages as they are hidden via CSS; do not update progressText
            };

            backBtn.addEventListener('click', () => navigate(-1));
            renderScreen();
        });

        // === Sheet endpoint config ===
        const SHEET_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzfWzv05ipGGX1qReai5aaotlZaJDF5X0DyVk5J3rW21ZiiMtG99H_JwUPXEsGV-0R6/exec'; // <- your /exec URL
        const SHEET_TOKEN = 'super-secret'; // must match Apps Script

        function normalizeForSheet(data) {
            // Flatten arrays to comma-separated strings; keep everything else as-is
            const join = v => Array.isArray(v) ? v.join(', ') : v ?? '';
            return {
                token: SHEET_TOKEN,
                session_id: '', // Will be set by caller
                name: data.name,
                // Capture the email provided on the final screen.  Support both the new 'email' key and the
                // legacy 'final' key for backward compatibility.  If data.email is empty or undefined,
                // fall back to data.final so the email is still captured for older flows.
                email: data.email || data.final,
                phone: data.phone,
                final: data.final,
                status: data.status,
                goal: data.goal,                               // array OK (server joins)
                frustration: data.frustration,                 // array OK (server joins)
                timeCommitment: data.timeCommitment,
                programDuration: data.programDuration,
                importantFeatures: data.importantFeatures,     // array OK
                device: data.device,
                degree: data.degree,
                collegeName: data.collegeName,
                city: data.city,
                age: data.age,
                gender: data.gender,
                currentSalary: data.currentSalary,             // e.g., "Fresher" or "12L"
                targetSalary: data.targetSalary,               // e.g., "18L"
                budget: data.budget,
                enrollTimeline: data.enrollTimeline
            };
        }

        function sendToSheet(payload) {

            console.log(payload)
            // Apps Script web apps can’t reliably set CORS; use no-cors so the write succeeds.
            // (You won’t be able to read the JSON response—this is expected.)
            try {
                fetch(SHEET_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                // Swallow; we already show the thank-you screen.
                console.warn('Sheet post failed (ignored):', e);
            }
        }

    </script>
</body>

</html>
