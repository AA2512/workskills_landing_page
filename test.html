<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Placements</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f8fef8;
    }
    .card img.profile {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 0.5rem;
    }
    .card img.logo {
      width: 80px;
      height: auto;
      margin-top: 0.5rem;
    }
    .name { font-weight: bold; }
    .role { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <h1>Placements</h1>

  <!-- Filters -->
  <div class="filters">
    <select id="yearFilter">
      <option value="all">Year of Graduation</option>
    </select>
    <select id="degreeFilter">
      <option value="all">Degree</option>
    </select>
  </div>

  <!-- Placement Cards -->
  <div id="placements" class="cards"></div>

  <script>
    let placementsData = [];

    async function loadPlacements() {
      const res = await fetch('placements_data.json');
      placementsData = await res.json();

      populateFilters();
      renderCards(placementsData);
    }

    function populateFilters() {
      const yearFilter = document.getElementById('yearFilter');
      const degreeFilter = document.getElementById('degreeFilter');

      // Unique years
      const years = [...new Set(placementsData.map(p => p.GraduationYear))];
      years.forEach(year => {
        const opt = document.createElement('option');
        opt.value = year;
        opt.textContent = year;
        yearFilter.appendChild(opt);
      });

      // Unique degrees
      const degrees = [...new Set(placementsData.map(p => p.Degree))];
      degrees.forEach(deg => {
        const opt = document.createElement('option');
        opt.value = deg;
        opt.textContent = deg;
        degreeFilter.appendChild(opt);
      });

      yearFilter.addEventListener('change', filterData);
      degreeFilter.addEventListener('change', filterData);
    }

    function filterData() {
      const year = document.getElementById('yearFilter').value;
      const degree = document.getElementById('degreeFilter').value;

      let filtered = placementsData;

      if (year !== 'all') {
        filtered = filtered.filter(p => p.GraduationYear == year);
      }
      if (degree !== 'all') {
        filtered = filtered.filter(p => p.Degree == degree);
      }

      renderCards(filtered);
    }

    function renderCards(data) {
      const container = document.getElementById('placements');
      container.innerHTML = '';

      data.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <img src="${p.ProfilePicture}" alt="${p.Name}" class="profile"/>
          <div class="name">${p.Name}</div>
          <div class="role">${p.NewCompanyPosition} @ ${p.NewCompanyName}</div>
          <div>${p.PlacedHowLongAgo}</div>
          <img src="${p.NewCompanyLogo}" alt="${p.NewCompanyName}" class="logo"/>
        `;

        container.appendChild(card);
      });
    }

    loadPlacements();
  </script>
</body>
</html>
